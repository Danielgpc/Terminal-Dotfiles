# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Cursor Customization
cursor_shape                 beam
cursor_beam_thickness        1.5
cursor_blink_interval        0.5
cursor_stop_blinking_after   15.0

# Smooth Cursor Animation
cursor_trail                 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# Window Layout & Blur Background
background_blur              1
window_padding_width         12
hide_window_decorations      yes
confirm_os_window_close      0

# Mouse & Bell
mouse_hide_wait              3.0
enable_audio_bell            no

confirm_os_window_close -1


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include catppuccin-mocha.conf
# END_KITTY_THEME

# Enable notifications when a command finishes if the window is unfocused
notify_on_cmd_finish unfocused

# Optional: Set the minimum duration (in seconds) a command must run to trigger the alert
# For example, only alert if a command takes longer than 3 seconds
notify_on_cmd_finish unfocused 3.0
